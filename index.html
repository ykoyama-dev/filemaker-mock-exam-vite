<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileMaker 模擬試験</title>
  </head>
  <body>
    <header class="sticky top-0 z-10 flex items-center justify-between gap-2 border-b border-slate-200 bg-white px-4 py-2.5 dark:border-slate-700 dark:bg-slate-900">
      <div id="app-title" class="font-bold">Claris FileMaker 技術者試験 模擬試験</div>
      <div id="timer" class="font-bold tabular-nums" hidden></div>
    </header>

    <main class="mx-auto max-w-4xl px-4 pt-5 pb-16">
      <!-- TOP 画面（試験の選択） -->
      <section id="screen-top">
        <h1 class="mb-2 text-2xl font-bold">Claris FileMaker 技術者試験 模擬試験</h1>
        <p class="muted">受験する試験を選択してください。</p>
        <div id="exam-cards" class="mt-4 grid grid-cols-[repeat(auto-fit,minmax(260px,1fr))] gap-4"></div>
      </section>

      <!-- スタート画面 -->
      <section id="screen-start" hidden>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1 id="start-title" class="text-2xl font-bold"></h1>
          <button id="btn-to-top" type="button" class="btn">試験を選び直す</button>
        </div>
        <p class="muted mt-2"><span id="start-lead"></span>全 <span id="pool-count"></span> 問の中から出題します。</p>

        <fieldset class="card">
          <legend class="px-1.5 font-bold">モード</legend>
          <label class="flex cursor-pointer items-start gap-2.5 py-1.5">
            <input type="radio" name="mode" value="exam" class="mt-1.5" checked />
            <span><strong>本番モード</strong><br /><small class="muted">分野ごとの配分どおり <span id="exam-count"></span>問・制限時間 <span id="exam-minutes"></span>分。各分野では出題回数の少ない問題を優先して出題し、採点結果は成績として保存します。</small></span>
          </label>
          <label class="flex cursor-pointer items-start gap-2.5 py-1.5">
            <input type="radio" name="mode" value="practice" class="mt-1.5" />
            <span><strong>練習モード</strong><br /><small class="muted">分野と問題数を選べます。1問ごとにその場で正誤を判定します。</small></span>
          </label>
        </fieldset>

        <fieldset id="practice-options" class="card" hidden>
          <legend class="px-1.5 font-bold">練習モードの設定</legend>
          <div id="field-list" class="mb-3 grid gap-1"></div>
          <label class="inline-flex items-center gap-2">出題数
            <select id="practice-count" class="input">
              <option value="10">10問</option>
              <option value="20">20問</option>
              <option value="0">選んだ分野のすべて</option>
            </select>
          </label>
        </fieldset>

        <p id="start-error" class="mb-3 font-bold text-rose-600 dark:text-rose-400" role="alert" hidden></p>
        <div class="flex flex-wrap gap-2">
          <button id="btn-start" type="button" class="btn btn-primary">開始する</button>
          <button id="btn-open-list" type="button" class="btn">問題一覧を見る</button>
          <button id="btn-open-scores" type="button" class="btn">成績を見る</button>
        </div>
      </section>

      <!-- 成績画面（本番モードの履歴と分野別正答率） -->
      <section id="screen-scores" hidden>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1 id="s-title" class="text-2xl font-bold">成績</h1>
          <button id="btn-scores-home" type="button" class="btn">最初の画面に戻る</button>
        </div>
        <p class="muted mt-2">本番モードで採点した結果を、このパソコンのブラウザに保存しています。</p>
        <div id="s-summary" class="card flex flex-wrap items-center gap-6"></div>

        <h2 class="mt-7 mb-2.5 text-lg font-bold">分野別の正答率（累計）</h2>
        <table class="data-table">
          <thead><tr><th>知識分野</th><th>正解 / 出題</th><th>正答率</th></tr></thead>
          <tbody id="s-fields"></tbody>
        </table>

        <h2 class="mt-7 mb-2.5 text-lg font-bold">受験履歴</h2>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead id="s-history-head"></thead>
            <tbody id="s-history"></tbody>
          </table>
        </div>

        <div class="my-5 flex flex-wrap gap-2">
          <button id="btn-csv" type="button" class="btn btn-primary">CSV で書き出す</button>
          <button id="btn-clear-scores" type="button" class="btn btn-danger">この試験の成績を削除</button>
        </div>
      </section>

      <!-- 問題一覧画面 -->
      <section id="screen-list" hidden>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h1 class="text-2xl font-bold">問題一覧</h1>
          <button id="btn-list-home" type="button" class="btn">最初の画面に戻る</button>
        </div>
        <div class="card flex flex-wrap items-center gap-3">
          <label class="inline-flex items-center gap-2">分野
            <select id="list-field" class="input"></select>
          </label>
          <label class="inline-flex items-center gap-2">形式
            <select id="list-type" class="input">
              <option value="">すべて</option>
              <option value="single">単一回答</option>
              <option value="multi">複数回答</option>
            </select>
          </label>
          <label id="list-source-label" class="inline-flex items-center gap-2">出典
            <select id="list-source" class="input">
              <option value="">すべて</option>
              <option value="base">学習ガイド準拠</option>
              <option value="gb">ガイドブック準拠</option>
            </select>
          </label>
          <input id="list-keyword" type="search" maxlength="100" class="input min-w-0 flex-[1_1_220px]" placeholder="キーワード（問題文・選択肢・ID）" />
        </div>
        <p id="list-error" class="mb-2 text-rose-600 dark:text-rose-400" role="alert" hidden></p>
        <p id="list-count" class="muted mb-2"></p>
        <div id="list-body" class="grid gap-1.5"></div>
      </section>

      <!-- 問題詳細画面（一覧から選択） -->
      <section id="screen-detail" hidden>
        <div class="muted flex flex-wrap items-center justify-between gap-2">
          <span id="d-position"></span>
          <span id="d-meta" class="tag"></span>
        </div>
        <div class="card">
          <div id="d-type" class="mb-1 text-sm font-bold text-blue-700 dark:text-blue-300"></div>
          <p id="d-text" class="mb-3.5 whitespace-pre-wrap"></p>
          <div id="d-choices" class="grid gap-2"></div>
          <div id="d-feedback" class="feedback" hidden></div>
        </div>
        <div class="my-3 flex flex-wrap gap-2">
          <button id="d-back" type="button" class="btn">一覧に戻る</button>
          <button id="d-prev" type="button" class="btn">前の問題</button>
          <button id="d-check" type="button" class="btn btn-primary">回答する</button>
          <button id="d-show" type="button" class="btn">正解を表示</button>
          <button id="d-next" type="button" class="btn">次の問題</button>
        </div>
      </section>

      <!-- 出題画面 -->
      <section id="screen-quiz" hidden>
        <div class="muted flex flex-wrap items-center justify-between gap-2">
          <span id="q-progress"></span>
          <span id="q-field" class="tag"></span>
        </div>
        <div class="card">
          <div id="q-type" class="mb-1 text-sm font-bold text-blue-700 dark:text-blue-300"></div>
          <p id="q-text" class="mb-3.5 whitespace-pre-wrap"></p>
          <div id="q-choices" class="grid gap-2"></div>
          <div id="q-feedback" class="feedback" hidden></div>
        </div>
        <div class="my-3 flex flex-wrap gap-2">
          <button id="btn-prev" type="button" class="btn">前へ</button>
          <button id="btn-flag" type="button" class="btn">見直し</button>
          <button id="btn-check" type="button" class="btn btn-primary">回答する</button>
          <button id="btn-next" type="button" class="btn">次へ</button>
          <button id="btn-finish" type="button" class="btn btn-danger">採点する</button>
        </div>
        <nav id="q-nav" class="mt-3 flex flex-wrap gap-1.5" aria-label="問題番号"></nav>
      </section>

      <!-- 結果画面 -->
      <section id="screen-result" hidden>
        <h1 class="text-2xl font-bold">結果</h1>
        <div class="card flex flex-wrap items-center gap-6">
          <div class="text-5xl leading-none font-bold"><span id="r-rate"></span><small class="text-xl">%</small></div>
          <div id="r-detail" class="muted"></div>
        </div>
        <p id="r-saved" class="muted" hidden></p>

        <h2 class="mt-7 mb-2.5 text-lg font-bold">分野別の正答率</h2>
        <table class="data-table">
          <thead><tr><th>知識分野</th><th>正解 / 出題</th><th>正答率</th></tr></thead>
          <tbody id="r-fields"></tbody>
        </table>

        <div class="my-5 flex flex-wrap gap-2">
          <button id="btn-retry-wrong" type="button" class="btn btn-primary">間違えた問題だけ解き直す</button>
          <button id="btn-result-scores" type="button" class="btn">成績を見る</button>
          <button id="btn-home" type="button" class="btn">最初の画面に戻る</button>
        </div>

        <h2 class="mt-7 mb-2.5 text-lg font-bold">問題ごとの見直し</h2>
        <label class="inline-flex items-center gap-2"><input type="checkbox" id="only-wrong" /> 不正解の問題だけ表示</label>
        <div id="r-review"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
